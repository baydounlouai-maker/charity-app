<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Log In · United Charity</title>
  <link rel="stylesheet" href="/common/style.css" />
</head>
<body class="auth-page">

  <a href="/pages/homepage/homepage.html" class="auth-brand">♡ United Charity</a>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to continue making a difference.</p>

      <div id="form-error" class="alert alert-danger" style="display:none"></div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Your username" autocomplete="username" required />
        </div>

        <div class="field password-field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required />
            <button type="button" class="toggle-visibility" id="toggleBtn" aria-label="Toggle password visibility">
              <svg class="icon-show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-hide" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Log In</button>
      </form>

      <p class="auth-link">Don't have an account? <a href="/pages/signup/signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="/common/script.js"></script>
  <script src="login.js"></script>
</body>
</html>
