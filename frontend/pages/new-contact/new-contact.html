<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Add Contact · United Charity</title>
  <link rel="stylesheet" href="/common/style.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page-main">
    <div class="container" style="max-width:540px">
      <div class="auth-card">
        <h1 style="color:var(--clr-primary);margin-bottom:var(--sp-2)">Add Contact</h1>
        <p class="auth-subtitle">A contact info to save.</p>

        <div id="form-error" class="alert alert-danger" style="display:none"></div>

        <form id="contact-form">
          <div class="field">
            <label for="label">Label <span style="color:var(--clr-danger)">*</span></label>
            <input type="text" id="label" placeholder="e.g. Coordinator, Manager" required />
          </div>
          <div class="field">
            <label for="name">Full Name <span style="color:var(--clr-danger)">*</span></label>
            <input type="text" id="name" placeholder="Contact person's name" required />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="email">Email <span style="color:var(--clr-danger)">*</span></label>
              <input type="email" id="email" placeholder="john@mail.com" required />
            </div>
            <div class="field">
              <label for="phone">Phone <span style="color:var(--clr-danger)">*</span></label>
              <input type="tel" id="phone" placeholder="70 123 456" required />
            </div>
          </div>
          <div style="display:flex;gap:var(--sp-3)">
            <a href="/pages/contacts/contacts.html" class="btn btn-ghost btn-full">Cancel</a>
            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Save Contact</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/common/script.js"></script>
  <script src="/common/components/toast.js"></script>
  <script src="/common/components/header.js"></script>
  <script src="/common/components/footer.js"></script>
  <script src="new-contact.js"></script>
</body>
</html>
