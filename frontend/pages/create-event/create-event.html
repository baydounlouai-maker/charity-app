<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Create Event · United Charity</title>
  <link rel="stylesheet" href="/common/style.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page-main">
    <div class="container" style="max-width:680px">
      <div class="page-header">
        <h1>Create Event</h1>
        <p>Fill in the details below to submit your event for review.</p>
      </div>

      <div class="auth-card">
        <div id="form-error" class="alert alert-danger" style="display:none"></div>

        <form id="create-form">
          <div class="field">
            <label for="title">Event Title <span style="color:var(--clr-danger)">*</span></label>
            <input type="text" id="title" placeholder="A clear, descriptive title" required />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="category">Category <span style="color:var(--clr-danger)">*</span></label>
              <select id="category" required>
                <option value="">Select…</option>
                <option>Money</option>
                <option>Food</option>
                <option>Clothes</option>
                <option>Medical</option>
              </select>
            </div>
            <div class="field">
              <label for="urgency">Urgency <span style="color:var(--clr-danger)">*</span></label>
              <select id="urgency" required>
                <option value="">Select…</option>
                <option>Critical</option>
                <option>High</option>
                <option>Standard</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="description">Description <span style="color:var(--clr-danger)">*</span></label>
            <textarea id="description" rows="4" placeholder="Describe the event and what you need…" required></textarea>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="event_date">Event Date &amp; Time <span style="color:var(--clr-danger)">*</span></label>
              <input type="datetime-local" id="event_date" required />
            </div>
            <div class="field">
              <label for="due_date">Donation Deadline <span style="color:var(--clr-danger)">*</span></label>
              <input type="date" id="due_date" required />
            </div>
          </div>

          <div class="field">
            <label for="required_units">Required Units <span style="color:var(--clr-danger)">*</span></label>
            <input type="number" id="required_units" min="1" placeholder="e.g. 100" required />
            <div class="field-hint">Total units needed to fulfill this event's goal.</div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="address_id">Address <span style="color:var(--clr-danger)">*</span></label>
              <select id="address_id" required>
                <option value="">Loading addresses…</option>
              </select>
              <div class="field-hint"><a href="/pages/new-address/new-address.html" class="link-sm">+ Add new address</a></div>
            </div>
            <div class="field">
              <label for="contact_id">Contact <span style="color:var(--clr-danger)">*</span></label>
              <select id="contact_id" required>
                <option value="">Loading contacts…</option>
              </select>
              <div class="field-hint"><a href="/pages/new-contact/new-contact.html" class="link-sm">+ Add new contact</a></div>
            </div>
          </div>

          <div style="display:flex;gap:var(--sp-3)">
            <a href="/pages/my-events/my-events.html" class="btn btn-ghost btn-full">Cancel</a>
            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Submit for Review</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/common/script.js"></script>
  <script src="/common/components/toast.js"></script>
  <script src="/common/components/header.js"></script>
  <script src="/common/components/footer.js"></script>
  <script src="create-event.js"></script>
</body>
</html>
